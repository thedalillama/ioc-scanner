<div id="subcategory-information-flow">
  <style>
    #subcategory-information-flow { color: var(--foreground); }
    #subcategory-information-flow svg { width: 100%; height: auto; display: block; }
    #subcategory-information-flow .outcome { fill: color-mix(in srgb, var(--blue) 15%, var(--background)); stroke: var(--blue); }
    #subcategory-information-flow .information { fill: color-mix(in srgb, var(--green) 15%, var(--background)); stroke: var(--green); }
    #subcategory-information-flow .consumer { fill: color-mix(in srgb, var(--orange) 14%, var(--background)); stroke: var(--orange); }
    #subcategory-information-flow .node { stroke-width: 1.5; rx: 9; }
    #subcategory-information-flow .edge { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; marker-end: url(#arrow); }
    #subcategory-information-flow text { fill: var(--foreground); font-family: sans-serif; font-size: 13px; }
    #subcategory-information-flow .small { fill: var(--muted-foreground); font-size: 11px; }
    #subcategory-information-flow .title { font-size: 18px; font-weight: 500; }
    #subcategory-information-flow .legend { font-size: 12px; }
